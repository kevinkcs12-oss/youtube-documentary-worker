name: B01 Kokoro Adaptive Timing Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/b01_kokoro_adaptive_timing.py"
      - ".github/workflows/b01-kokoro-adaptive-timing.yml"

permissions:
  contents: read

jobs:
  adaptive-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile
      - run: python scripts/b01_kokoro_adaptive_timing.py
      - run: cat dist/b01-kokoro-adaptive/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: b01-kokoro-adaptive-timing-${{ github.run_id }}
          path: dist/b01-kokoro-adaptive/
          retention-days: 7
          if-no-files-found: error

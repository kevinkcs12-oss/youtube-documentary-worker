name: Media Job

on:
  workflow_dispatch:

jobs:
  media-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run media job
        run: python scripts/run_media_job.py

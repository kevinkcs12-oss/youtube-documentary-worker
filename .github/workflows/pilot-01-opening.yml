name: Pilot 01 Opening Real Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "jobs/pilot-01-opening-real-assets-v0.1.json"
      - "production/pilot-01/opening-real-assets-v0.1.md"
      - ".github/workflows/pilot-01-opening.yml"

permissions:
  contents: read

jobs:
  render-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Acquire three approved Pexels masters
        run: |
          mkdir -p jobs/assets/pexels
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0"             --output jobs/assets/pexels/pexels-6775059.mp4             https://www.pexels.com/download/video/6775059/
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0"             --output jobs/assets/pexels/pexels-5243465.mp4             https://www.pexels.com/download/video/5243465/
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0"             --output jobs/assets/pexels/pexels-12187901.mp4             https://www.pexels.com/download/video/12187901/

      - name: Render 30-second real-asset conform
        run: |
          python scripts/run_media_job.py             --job jobs/pilot-01-opening-real-assets-v0.1.json             --output-dir dist/opening

      - name: Create preview frame strip
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i dist/opening/pilot-01-opening-real-assets-v0.1.mp4             -vf "fps=1/3,scale=480:-1,tile=5x2"             -frames:v 1 -update 1             dist/opening/preview-contact-sheet.jpg

      - name: Upload opening conform
        uses: actions/upload-artifact@v4
        with:
          name: pilot-01-opening-real-assets-${{ github.run_id }}
          path: dist/opening/
          if-no-files-found: error
          retention-days: 7
